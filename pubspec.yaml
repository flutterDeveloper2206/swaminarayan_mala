name: swaminarayan_mala
description: "Jai Swaminarayan — Har Saans Mein Naam, Har Pal Mein Shanti."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  path_provider: ^2.1.5
  intl: any
  uuid: ^4.5.1
  audioplayers: ^6.4.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  share_plus: ^10.1.4
  file_picker: ^10.1.2
  collection: ^1.19.0
  image_picker: ^1.2.2
  confetti: ^0.8.0
  animated_digit: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#6B020B"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/gods/
    - assets/gurus/
    - assets/backgrounds/
    - assets/icons/
    - assets/audio/
    - assets/stories/
    - assets/data/
    - assets/kids/
